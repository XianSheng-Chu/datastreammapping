# configs/rules/base_rules.yaml
# version: "1.0"

basic_table:
#规则值,用于自定义匹配规则
    pattern:
    #用于匹配相关的节点
        type : "node"
        level: "current"
        #匹配的节点层级
        class_name: "table"
        #匹配的类名
    conditions:
    #匹配上的节点继续时所需要满足的条件,对于两个同级的列表项，默认作为or条件使用，只要有一个条件满足就代表该条件校验通过，权重值会直接取所有被满足的条件的最大值
        - And :
            - condition_true:
                weight : 2
            - parent_class:
                # 匹配父类是否为某一个特定的类
                class_name : "Expression"
                weight : 7
            - or:
                - condition_true:
                    weight: 2
                - sub_class:
                    - class_name: "Update"
                    - weight: 8


    actions:
    #满足条件时执行如下动作
        - add_node:
            #add_node将该节点添加至图之中
        - property_values:
            #获取@property_value的属性
            - db: schema
              #方法名：属性和备注(该名称作为节点的key存储)
            - catalog: catalog
            - alias: table_alias
            - name : table_name


basic_select:
    pattern:
        type: "node"
        level: "current"
        class_name: "select"
    conditions:
        - condition_true:
            weight: 3
    actions:
        - scopes: select
          # scopes的create只能限定在如下的节点之内 select,delete,update,merge
        - add_node:
        - set_stage : select



basic_from:
    pattern:
        type: "node"
        level: "current"
        class_name: "from"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : from

basic_where:
    pattern:
        type: "node"
        level: "current"
        class_name: "where"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : where

basic_join:
    pattern:
        type: "node"
        level: "current"
        class_name: "join"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : joins
        - args_values:
              #按照直接获取当前节点的表达式参数值
              - side:
                #side参数表示两张表join方式
                    node_key: join_side
                    # 参数值在存储时所用的键值
                    keep_missing : True
                    # value不存在时是否依旧记录该键值对
                    default_value: inner
                    # value不存在时使用的默认值




basic_column:
    pattern:
        type: "node"
        level: "current"
        class_name: "column"
    conditions:
        - condition_true:
            weight: 3
    actions:
        - add_node:
        - property_values:
              #获取@property_value的属性
              - db: schema
                  #方法名：属性和备注
              - catalog: catalog
              - alias: table_alias
              - name: table_name

basic_alias:
    pattern:
        type: "node"
        level: "current"
        class_name: "alias"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - property_values:
              #获取@property_value的属性
              - output_name: output_name

basic_with:
    pattern:
        type: "node"
        level: "current"
        class_name: "alias"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage: with
        - property_values:
              #获取@property_value的属性
              - recursive: recursive_flag
                #recursive用来标志改语句是否是递归的
        - args_values:
              #按照直接获取当前节点的表达式参数值
            - search:
              #search参数用来标记cte是一个标量cte
                  node_key: search_flag
                  # 参数值在存储时所用的键值
                  keep_missing: True
                  # value不存在时是否依旧记录该键值对


basic_cte:
    pattern:
        type: "node"
        level: "current"
        class_name: "cte"
    conditions:
        - condition_true:
            weight: 3
    actions:
        - add_node:
        - args_values:
              #按照直接获取当前节点的表达式参数值
            - alias:
              #cte表达式的别名
                  node_key: alias
                  # 参数值在存储时所用的键值
                  keep_missing: False
                  # value不存在时是否依旧记录该键值对

basic_group:
    pattern:
        type: "node"
        level: "current"
        class_name: "group"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : group

basic_order:
    pattern:
        type: "node"
        level: "current"
        class_name: "order"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : order


basic_having:
    pattern:
        type: "node"
        level: "current"
        class_name: "having"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - set_stage : having



basic_ordered:
    pattern:
        type: "node"
        level: "current"
        class_name: "ordered"
    conditions:
        - condition_true:
            weight: 2
    actions:
        - add_node:
        - args_values:
            - desc :
                node_key: nulls_first
                keep_missing: false


basic_literal:
    pattern:
        type: "node"
        level: "current"
        class_name: "literal"
    conditions:
        - condition_true:
            weight: 3
    actions:
        - add_node:
        - property_values:
              #获取@property_value的属性
              - output_name: literal_value

        - args_values:
            - is_string:
                node_key: is_string
                keep_missing: false

basic_func:
    pattern:
        type: "node"
        level: "super"
#       super代表匹配所有父类为func的节点
        class_name: "Func"
#       匹配父类时类名是大小写敏感的
    conditions:
        - and :
            - condition_true:
                weight: 3
            - in:
#                复合列表中的值的数据被视为有效的
                match_value: class_name
                weight: 3
                value_list:
                    [AggFunc,Abs,Flatten,Transform,Anonymous,Apply,Array,ToArray,List,Pad,ToChar,ToNumber,ToDouble,
                     Columns,Convert,ConvertTimezone,GenerateSeries,ArrayAll,ArrayAny,ArrayConcat,ArrayConstructCompact,
                     ArrayFilter,ArrayToString,String,StringToArray,ArraySize,ArraySort,ArraySum,Case,Cast,Try,
                     CastToStrType,Ceil,Coalesce,Chr,Concat,Contains,ConnectByRoot,Cbrt,CurrentDate,CurrentDatetime,
                     CurrentTime,CurrentTimestamp,CurrentUser,DateTrunc,Datetime,DayOfWeek,DayOfWeekIso,DayOfMonth,DayOfYear,
                     ToDays,WeekOfYear,MonthsBetween,MakeInterval,Extract,Timestamp,DateFromParts,TimeFromParts,
                     DateStrToDate,DateToDateStr,DateToDi,Date,Day,Decode,DiToDate,Encode,Exp,Inline,Floor,FromBase64,
                     FeaturesAtTime,ToBase64,FromISO8601Timestamp,GapFill,GenerateDateArray,GenerateTimestampArray,Greatest,
                     Hex,If,Nullif,Initcap,IsAscii,IsNan,Int64,IsInf,JSONObject,JSONArray,JSONArrayAgg,JSONExists,JSONValueArray,
                     JSONTable,ObjectInsert,OpenJSON,JSONBExists,JSONExtractArray,JSONFormat,ParseJSON,Least,Left,Right,Length,
                     Levenshtein,Ln,Log,Lower,Map,ToMap,MapFromEntries,StarMap,VarMap,MatchAgainst,MD5,MD5Digest,Month,AddMonths,
                     Nvl2,Normalize,Overlay,Predict,Quarter,Rand,Randn,RangeN,ReadCSV,Reduce,RegexpExtract,RegexpExtractAll,
                     RegexpReplace,RegexpSplit,Repeat,Round,RowNumber,SafeDivide,SHA,SHA2,Sign,SortArray,Split,SplitPart,Substring,
                     StandardHash,StartsWith,StrPosition,StrToDate,StrToTime,StrToUnix,StrToMap,NumberToStr,FromBase,Struct,StructExtract,
                     Stuff,Sqrt,Time,TimeToStr,TimeToTimeStr,TimeToUnix,TimeStrToDate,TimeStrToTime,TimeStrToUnix,Trim,TsOrDsToDateStr,
                     TsOrDsToDate,TsOrDsToDatetime,TsOrDsToTime,TsOrDsToTimestamp,TsOrDiToDi,Unhex,Unicode,UnixDate,UnixToStr,
                     UnixToTime,UnixToTimeStr,UnixSeconds,Uuid,TimestampFromParts,Upper,Week,XMLElement,XMLTable,Year,NextValueFor,]
    actions:
        - add_node:














