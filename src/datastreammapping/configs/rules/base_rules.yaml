# configs/rules/base_rules.yaml
# version: "1.0"

basic_table:
#规则值,用于自定义匹配规则
    pattern:
    #用于匹配相关的节点
        type : "node"
        level: "current"
        #匹配的节点层级
        class_name: "table"
        #匹配的类名
    conditions:
    #匹配上的节点继续时所需要满足的条件,对于两个同级的列表项，默认作为or条件使用，只要有一个条件满足就代表该条件校验通过，权重值会直接取所有被满足的条件的最大值
        - And :
            - condition_true:
                weight : 1
            - parent_class:
                # 匹配父类是否为某一个特定的类
                class_name : "Expression"
                weight : 7
            - or:
                - condition_true:
                    weight: 1
                - sub_class:
                    - class_name: "Update"
                    - weight: 8


    actions:
    #满足条件时执行如下动作
        #挂载作用域
        - return:
        #返回构造值
            return_type:
                dict
            data:
                key_type:
                  str
                key_name:
                  "table_name"
                value_type:
                  str
                value_name:
                  "${this.}"

basic_select:
    pattern:
        type: "node"
        level: "current"
        class_name: "select"
    conditions:
        - condition_true:
            weight: 1
    actions:
      - scopes: select
        # scopes的create只能限定在如下的节点之内 select,delete,update,merge


basic_from:
    pattern:
        type: "node"
        level: "current"
        class_name: "from"
    conditions:
        - condition_true:
            weight: 1
    actions:
      - set_stage : from
