            weight: 2
    actions:
        - add_node:
        - set_stage: with
        - property_values:
              #获取@property_value的属性
              - recursive: recursive_flag
                #recursive用来标志改语句是否是递归的



basic_cte:
    pattern:
        type: "node"
        level: "current"
        class_name: "cte"
    conditions:
        - condition_true:
            weight: 3
    actions:
        - add_node:
        - args_values:
              #按照直接获取当前节点的表达式参数值
            - alias:
              #cte表达式的别名
                  node_key: alias
                  # 参数值在存储时所用的键值
                  keep_missing: False
                  # value不存在时是否依旧记录该键值对
            - scalar:
                #search参数用来标记cte是一个标量cte
                node_key: scalar_flag
                # 参数值在存储时所用的键值
                keep_missing: True
                # value不存在时是否依旧记录该键值对

